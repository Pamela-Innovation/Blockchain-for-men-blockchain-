name: CronJob - Liquidator Bot - Optimism
on:
  schedule:
    - cron: "50 * * * *" # ie. 4:50pm, 5:50pm ... etc.
env:
  CHAIN_ID: 10
  MIN_PROFIT_THRESHOLD_USD: 0.5
  SWAP_RECIPIENT: ''
  JSON_RPC_URL: ${{ secrets.OPTIMISM_MAINNET_JSON_RPC_URL }}
  COVALENT_API_KEY: ${{ secrets.COVALENT_API_KEY }}
  CUSTOM_RELAYER_PRIVATE_KEY: ${{ secrets.CUSTOM_RELAYER_PRIVATE_KEY }}
  CONTRACT_JSON_URL: 'https://raw.githubusercontent.com/GenerationSoftware/pt-v5-mainnet/396f04daedc5a38935460ddf47d2f10e9ac1fec6/deployments/optimism/contracts.json'
  ENV_TOKEN_ALLOW_LIST: ''
  NODE_OPTIONS: "--max_old_space_size=32768"
permissions: write-all
jobs:
  runCLI:
    name: Liquidator Bot
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        node: ["20.11.1"]
        os: [ubuntu-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Store current date
        id: date
        run: echo "RUN_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
      
      - name: Store current time
        id: time
        run: echo "RUN_TIME=$(date +'%H-%M-%S_%Z')" >> "$GITHUB_ENV"

      - name: Preflight required env
        id: preflight
        shell: bash
        run: |
          can_run=false
          trap 'echo "can_run=${can_run}" >> "$GITHUB_OUTPUT"' EXIT

          missing=()
          [[ -n "${JSON_RPC_URL}" ]] || missing+=("JSON_RPC_URL")
          [[ -n "${CUSTOM_RELAYER_PRIVATE_KEY}" ]] || missing+=("CUSTOM_RELAYER_PRIVATE_KEY")
          [[ -n "${CONTRACT_JSON_URL}" ]] || missing+=("CONTRACT_JSON_URL")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Skipping bot run because required environment variables are missing: ${missing[*]}"
          else
            can_run=true
          fi

      - name: Run bot
        if: steps.preflight.outputs.can_run == 'true'
        id: runBot
        continue-on-error: true
        run: |
          npm install
          npx tsx index.ts

      - name: Push changes (if required)
        if: steps.preflight.outputs.can_run == 'true' && steps.runBot.outcome == 'success'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          force: true

      - name: Comment Error
        id: commentError
        if: always() && steps.preflight.outputs.can_run == 'true' && steps.runBot.outcome == 'failure'
        uses: actions/github-script@v5
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Liquidator bot failed for run at ${process.env.RUN_DATE ?? 'unknown'}__${process.env.RUN_TIME ?? 'unknown'}: Exit Code 1`
            })

      - name: Fail workflow when bot fails
        if: always() && steps.preflight.outputs.can_run == 'true' && steps.runBot.outcome == 'failure'
        run: exit 1

name: CronJob - Liquidator Bot - Arbitrum
on:
  schedule:
    - cron: "50 * * * *" # ie. 4:50pm, 5:50pm ... etc.
env:
  CHAIN_ID: 42161
  MIN_PROFIT_THRESHOLD_USD: 0.5
  SWAP_RECIPIENT: ''
  JSON_RPC_URL: ${{ secrets.ARBITRUM_MAINNET_JSON_RPC_URL }}
  COVALENT_API_KEY: ${{ secrets.COVALENT_API_KEY }}
  CUSTOM_RELAYER_PRIVATE_KEY: ${{ secrets.CUSTOM_RELAYER_PRIVATE_KEY }}
  CONTRACT_JSON_URL: 'https://raw.githubusercontent.com/GenerationSoftware/pt-v5-mainnet/bc9e4b4c25a033ec3c1c2b89b62422399b7db2f6/deployments/arbitrum/contracts.json'
  ENV_TOKEN_ALLOW_LIST: '0x8653084e01bd8c9e24b9a8feb2036251ee0c16a9,0x0000206329b97DB379d5E1Bf586BbDB969C63274'
  NODE_OPTIONS: "--max_old_space_size=32768"
permissions: write-all
jobs:
  runCLI:
    name: Liquidator Bot
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        node: ["20.11.1"]
        os: [ubuntu-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Store current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
      
      - name: Store current time
        id: time
        run: echo "time=$(date +'%H-%M-%S_%Z')" >> "$GITHUB_ENV"

      - name: Check required bot configuration
        if: ${{ env.JSON_RPC_URL == '' || env.CUSTOM_RELAYER_PRIVATE_KEY == '' || env.CONTRACT_JSON_URL == '' }}
        run: |
          missing_vars=()
          [ -n "${JSON_RPC_URL}" ] || missing_vars+=("JSON_RPC_URL")
          [ -n "${CUSTOM_RELAYER_PRIVATE_KEY}" ] || missing_vars+=("CUSTOM_RELAYER_PRIVATE_KEY")
          [ -n "${CONTRACT_JSON_URL}" ] || missing_vars+=("CONTRACT_JSON_URL")

          echo "Skipping bot run because the following required environment variables are missing: ${missing_vars[*]}"

      - name: Run bot
        id: runBot
        if: ${{ env.JSON_RPC_URL != '' && env.CUSTOM_RELAYER_PRIVATE_KEY != '' && env.CONTRACT_JSON_URL != '' }}
        run: |
          npm install
          npx tsx index.ts

      - name: Push changes (if required)
        if: ${{ env.JSON_RPC_URL != '' && env.CUSTOM_RELAYER_PRIVATE_KEY != '' && env.CONTRACT_JSON_URL != '' }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          force: true

      - name: Comment Error
        id: commentError
        if: ${{ failure() && env.JSON_RPC_URL != '' && env.CUSTOM_RELAYER_PRIVATE_KEY != '' && env.CONTRACT_JSON_URL != '' }}
        uses: actions/github-script@v5
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Liquidator bot failed for run at "$date"__"$time": Exit Code 1`
            })

name: CronJob - Liquidator Bot - Base
on:
  schedule:
    - cron: "50 * * * *" # ie. 4:50pm, 5:50pm ... etc.
env:
  CHAIN_ID: 8453
  MIN_PROFIT_THRESHOLD_USD: 0.5
  SWAP_RECIPIENT: ''
  JSON_RPC_URL: ${{ secrets.BASE_MAINNET_JSON_RPC_URL }}
  COVALENT_API_KEY: ${{ secrets.COVALENT_API_KEY }}
  CUSTOM_RELAYER_PRIVATE_KEY: ${{ secrets.CUSTOM_RELAYER_PRIVATE_KEY }}
  CONTRACT_JSON_URL: 'https://raw.githubusercontent.com/GenerationSoftware/pt-v5-mainnet/bc84c3f5e1d9703372ae7f9baf584bab42f47b27/deployments/base/contracts.json'
  CLAIM_REWARDS: 'true'
  ENV_TOKEN_ALLOW_LIST: ''
  DRY_RUN: 'true'
  NODE_OPTIONS: "--max_old_space_size=32768"
permissions:
  contents: write
  issues: write
jobs:
  runCLI:
    name: Liquidator Bot
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        node: ["20.11.1"]
        os: [ubuntu-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1
      
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Store current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
      
      - name: Store current time
        id: time
        run: echo "time=$(date +'%H-%M-%S_%Z')" >> "$GITHUB_ENV"

      - name: Run bot
        id: runBot
        continue-on-error: true
        run: |
          npm ci
          npx tsx index.ts

      - name: Push changes (if required)
        uses: ad-m/github-push-action@d91a481090679876dfc4178fef17f286781251df # v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          force: true

      - name: Comment Error
        id: commentError
        if: always() && steps.runBot.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Liquidator bot failed for run at "${process.env.date}__${process.env.time}": Exit Code 1`
            })

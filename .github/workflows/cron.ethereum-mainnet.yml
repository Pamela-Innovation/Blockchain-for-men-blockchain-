name: CronJob - Liquidator Bot - Ethereum Mainnet

on:
  workflow_dispatch:
  schedule:
    - cron: "50 * * * *"

env:
  CHAIN_ID: 1
  MIN_PROFIT_THRESHOLD_USD: 90
  SWAP_RECIPIENT: ''
  JSON_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_JSON_RPC_URL }}
  COVALENT_API_KEY: ${{ secrets.COVALENT_API_KEY }}
  CUSTOM_RELAYER_PRIVATE_KEY: ${{ secrets.CUSTOM_RELAYER_PRIVATE_KEY }}
  CONTRACT_JSON_URL: 'https://raw.githubusercontent.com/GenerationSoftware/pt-v5-mainnet/ca2acf967a962355b921fd4893306b961e7bc62a/deployments/ethereum/contracts.json'
  ENV_TOKEN_ALLOW_LIST: ''
  NODE_OPTIONS: "--max_old_space_size=32768"

permissions:
  contents: write
  issues: write

jobs:
  runCLI:
    name: Liquidator Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node 20.11.1
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1

      - name: Preflight required secrets
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in JSON_RPC_URL CUSTOM_RELAYER_PRIVATE_KEY CONTRACT_JSON_URL COVALENT_API_KEY; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            echo "missing_secrets=${missing[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "can_run=true" >> "$GITHUB_OUTPUT"
            echo "missing_secrets=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.preflight.outputs.can_run == 'true'
        run: npm ci

      - name: Run bot
        id: runBot
        if: steps.preflight.outputs.can_run == 'true'
        run: npx tsx index.ts

      - name: Push changes (if required)
        if: success() && steps.preflight.outputs.can_run == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          force: true

      - name: Open issue on bot failure
        if: failure() && steps.preflight.outputs.can_run == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Liquidator bot failed: ${context.workflow} #${context.runNumber}`,
              body: `Run URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          status="${{ job.status }}"
          can_run="${{ steps.preflight.outputs.can_run }}"
          if [ "$can_run" != "true" ]; then
            run_status="skipped"
          elif [ "$status" = "success" ]; then
            run_status="success"
          else
            run_status="failed"
          fi

          {
            echo "### Liquidator bot run summary"
            echo "- Chain ID: ${CHAIN_ID}"
            echo "- Run status: ${run_status}"
            if [ "$run_status" = "skipped" ]; then
              echo "- Missing required secrets: ${{ steps.preflight.outputs.missing_secrets }}"
            fi
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

name: CronJob - Liquidator Bot - Scroll
on:
  schedule:
    - cron: "50 * * * *" # ie. 4:50pm, 5:50pm ... etc.
  push:
env:
  CHAIN_ID: 534352
  MIN_PROFIT_THRESHOLD_USD: 0.5
  SWAP_RECIPIENT: ''
  JSON_RPC_URL: ${{ secrets.SCROLL_MAINNET_JSON_RPC_URL }}
  COVALENT_API_KEY: ${{ secrets.COVALENT_API_KEY }}
  CUSTOM_RELAYER_PRIVATE_KEY: ${{ secrets.CUSTOM_RELAYER_PRIVATE_KEY }}
  CONTRACT_JSON_URL: 'https://raw.githubusercontent.com/GenerationSoftware/pt-v5-mainnet/196aa20f4a0b3e651d0504ffeb0e1b9a08c7ccb6/deployments/scroll/contracts.json'
  ENV_TOKEN_ALLOW_LIST: ''
  NODE_OPTIONS: "--max_old_space_size=32768"
permissions: write-all
jobs:
  runCLI:
    name: Liquidator Bot
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        node: ["20.11.1"]
        os: [ubuntu-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Store current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
      
      - name: Store current time
        id: time
        run: echo "time=$(date +'%H-%M-%S_%Z')" >> "$GITHUB_ENV"

      - name: Store retention history cutoff
        id: historyDate
        run: echo "history_cutoff=$(date -u -d '14 months ago' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Validate required secrets
        id: validateSecrets
        run: |
          missing_vars=()
          [ -z "${JSON_RPC_URL}" ] && missing_vars+=("JSON_RPC_URL")
          [ -z "${CUSTOM_RELAYER_PRIVATE_KEY}" ] && missing_vars+=("CUSTOM_RELAYER_PRIVATE_KEY")
          [ -z "${CONTRACT_JSON_URL}" ] && missing_vars+=("CONTRACT_JSON_URL")

          if [ ${#missing_vars[@]} -gt 0 ]; then
            echo "has_required_secrets=false" >> "$GITHUB_OUTPUT"
            missing_vars_joined="${missing_vars[*]}"
            echo "missing_vars=$missing_vars_joined" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping liquidator run; missing required environment variables: $missing_vars_joined"
            {
              echo "Skipped liquidator bot run on chain ${CHAIN_ID}."
              echo "Date: ${date}"
              echo "Time: ${time}"
              echo "Retention history cutoff (1y2m ago): ${history_cutoff}"
              echo "Missing required environment variables: $missing_vars_joined"
            } > missing-secrets.txt
          else
            echo "has_required_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        id: runBot
        if: steps.validateSecrets.outputs.has_required_secrets == 'true'
        run: |
          npm install
          npx tsx index.ts

      - name: Upload missing-secrets artifact
        if: steps.validateSecrets.outputs.has_required_secrets != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scroll-liquidator-missing-secrets-${{ env.date }}-${{ env.time }}
          path: missing-secrets.txt
          retention-days: 90

      - name: Push changes (if required)
        if: always()
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          force: true

      - name: Comment Error
        id: commentError
        if: steps.runBot.outputs.exitcode == 1
        uses: actions/github-script@v5
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Liquidator bot failed for run at "$date"__"$time": Exit Code 1`
            })
